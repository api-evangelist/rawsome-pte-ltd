name: Rawsome Pte. Ltd.
description: Rawsome Pte. Ltd. (trading as Rawsome Asia Beverages) is a Singapore-based producer and
  distributor of small-batch, handcrafted raw kombucha sold under the Wild Boocha brand. The company
  brews fermented tea beverages -- including Citrus Green, Strawberry Mint, and Harmony Adaptogenic
  flavors -- available in one-liter bottles and refillable mini kegs, and markets them as a functional
  wellness drink rich in probiotics, polyphenols, B vitamins, vitamin C, organic enzymes, and amino
  acids. Rawsome operates a direct-to-consumer e-commerce storefront (built on Odoo) and was surfaced
  as a portfolio company of 500 Global. This profile currently has no public API, developer portal, or
  developer documentation; it is maintained in the API Evangelist network as a company record.
